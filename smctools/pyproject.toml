[project]
name = "smctools"
version = "0.1.0"
description = "Samilpo SMC score conversion (SMC -> IR -> MusicXML) and index tooling (placeholder)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
smctools = "smctools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smctools"]
